factor:
  name: eruption_followup_ratio
  name_cn: 喷发成交额跟随比例
  category: 微观结构
  direction: -1
  column: eruption_followup_ratio
  description: 过去 20 日 eruption_next_turnover_sum / eruption_turnover_sum（散户跟随强度）。论文
    IC -10.59% LS 30.09% IR 2.85。
universe:
  primary_index: MINUTE_DIR
calculation_steps:
- name: 加载分钟、分类、reduce 到日频
  action: minute_intraday_aggregate
  cache_key: prv_v3
  std_window: 20
  std_threshold: 1.0
  features:
  - eruption_turnover_sum
  - eruption_next_turnover_sum
  output_dataframe: data
- name: ex_to_20
  action: rolling
  source_column: eruption_turnover_sum
  output_column: ex_to_20
  window: 20
  agg: sum
  group_by: order_book_id
- name: ey_to_20
  action: rolling
  source_column: eruption_next_turnover_sum
  output_column: ey_to_20
  window: 20
  agg: sum
  group_by: order_book_id
- name: eruption_followup_ratio
  action: compute
  formula: ey_to_20 / ex_to_20
  source_columns:
  - ey_to_20
  - ex_to_20
  output_column: eruption_followup_ratio
