# 方正微观结构② 激进弱势半潮汐因子。论文: RankIC -2.69%, ICIR -2.35, 多空年化 5.81%, IR 1.40
factor:
  name: tide_weak_aggressive
  name_cn: 激进弱势半潮汐
  category: 微观结构
  direction: -1
  column: tide_weak_aggressive
  description: 过去20日"弱势半潮汐"价格变动速率均值(激进=取均值);弱势半段=推动力较小的一段。direction=-1。
universe:
  primary_index: MINUTE_DIR
calculation_steps:
  - {name: 分钟→日频弱势半潮汐速率, action: minute_tide, cache_key: tide_v1, features: [weak_halftide_rate], output_dataframe: data}
  - {name: 过去20日均值, action: rolling, source_column: weak_halftide_rate, output_column: tide_weak_aggressive, window: 20, agg: mean, group_by: order_book_id}
