factor:
  name: peak_ridge_minute_corr
  name_cn: 同时点峰岭数相关性
  category: 微观结构
  direction: -1
  column: peak_ridge_minute_corr
  description: 过去 20 日同时点（minute_of_day）的峰数与岭数的 Pearson 相关。已在 operator 内 pooled，spec
    直接取列。论文 IC -6.67% LS 22.78% IR 3.27。
universe:
  primary_index: MINUTE_DIR
calculation_steps:
- name: 加载分钟、分类、reduce 到日频
  action: minute_intraday_aggregate
  cache_key: prv_v3
  std_window: 20
  std_threshold: 1.0
  features:
  - peakridge_minute_corr_pooled
  output_dataframe: data
- name: peak_ridge_minute_corr
  action: rolling
  source_column: peakridge_minute_corr_pooled
  output_column: peak_ridge_minute_corr
  window: 1
  agg: mean
  group_by: order_book_id
