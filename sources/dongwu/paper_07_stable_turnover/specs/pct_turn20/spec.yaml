# 东吴证券 2021-05-15「量稳换手率选股因子」换手率变化率因子 PctTurn20
# 定义见 sources/dongwu/paper_07_stable_turnover/paper.md（原文 full.md line 127-133）
factor:
  name: pct_turn20
  name_cn: 换手率变化率因子
  category: 量价
  direction: -1
  column: pct_turn20
  description: >
    过去 20 个交易日「日换手率变化率」的平均值，其中日换手率变化率 = 当日换手率 / 基准换手率 - 1，
    基准换手率 = 再往前 X=40 个交易日换手率的均值（不含当日）。研报口径含横截面市值中性化。
    IC 为负，方向为 -1。注意与 GTR 的变化率口径不同（GTR 基准是昨日换手率）。
universe:
  primary_index: ALL
calculation_steps:
  - name: 加载日换手率面板（dquant get_turnover_rate 的 today，单位 %）
    action: load_panel
    panel_config: TURNOVER_RATE_PANEL_PATH
    output_column: turnover
  - name: 40日换手率均值（含当日，下一步 shift 后成为不含当日的基准）
    action: rolling
    source_column: turnover
    agg: mean
    window: 40
    min_periods: 40
    output_column: turnover_ma40_incl
  - name: 基准换手率 = 往前40个交易日均值（shift 1 位剔除当日）
    action: transform
    method: shift
    periods: 1
    source_column: turnover_ma40_incl
    output_column: turnover_base40
  - name: 日换手率变化率 = 当日换手率 / 基准换手率 - 1
    action: compute
    source_columns: [turnover, turnover_base40]
    formula: turnover / turnover_base40 - 1
    output_column: pct_turn_daily
  - name: 过去20个交易日换手率变化率的平均值
    action: rolling
    source_column: pct_turn_daily
    agg: mean
    window: 20
    min_periods: 20
    output_column: pct_turn20
