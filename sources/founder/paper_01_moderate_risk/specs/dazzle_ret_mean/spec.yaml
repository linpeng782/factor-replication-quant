# 方正微观结构① 月均耀眼收益率。论文: RankIC -8.62%, ICIR -4.15, 多空年化 31.48%
factor:
  name: dazzle_ret_mean
  name_cn: 月均耀眼收益率
  category: 微观结构
  direction: -1
  column: dazzle_ret_mean
  description: 近20日"适度日耀眼收益率"的均值。日耀眼收益率=激增时刻(ΔV>mean+std)当分钟收益率的当日均值；
    适度=|日值−当日截面均值|。收益适度→未来反转，direction=-1。方正微观①§3.3。
universe:
  primary_index: MINUTE_DIR
calculation_steps:
  - {name: 分钟→日频耀眼收益率, action: minute_dazzle, cache_key: dazzle_v1, features: [dazzle_ret], output_dataframe: data}
  - {name: 截面去均值, action: transform, method: cs_demean, source_column: dazzle_ret, output_column: ret_dm, group_by: date}
  - {name: 取绝对值(适度日耀眼收益率), action: transform, method: abs, source_column: ret_dm, output_column: moderate_ret}
  - {name: 月均(mean20), action: rolling, source_column: moderate_ret, output_column: dazzle_ret_mean, window: 20, agg: mean, group_by: order_book_id}
