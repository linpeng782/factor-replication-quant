# 华泰证券 2016-12-20「多因子系列之四：单因子测试之动量类因子」
# 因子定义 + 复现口径选择见 sources/htsec/paper_04_momentum/paper.md（原文 full.md line 213）
factor:
  name: wgt_return_12m
  name_cn: 换手率加权12月动量
  category: 量价
  direction: -1
  column: wgt_return_12m
  description: >
    最近 240 个交易日（12 个月）以日换手率为权重的归一化加权平均日收益率：Σ(turnover_i·ret_i)/Σ(turnover_i)。A 股呈反转效应，方向为负。
universe:
  primary_index: ALL
calculation_steps:
  - name: 加载日收益率面板（后复权 close 日收益）
    action: load_panel
    panel_config: RET1_PANEL_PATH
    output_column: ret1
  - name: 加载日换手率面板（dquant get_turnover_rate 的 today，单位 %）
    action: load_panel
    panel_config: TURNOVER_RATE_PANEL_PATH
    output_column: turnover
  - name: 240日换手率加权平均日收益
    action: rolling_weighted_mean
    source_column: ret1
    weight_column: turnover
    window: 240
    output_column: wgt_return_12m
