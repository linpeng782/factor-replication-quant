factor:
  name: peak_weighted_quantile
  name_cn: 量峰加权价格分位点
  category: 微观结构
  direction: 1
  column: peak_weighted_quantile
  description: 过去 20 日 peak_vwap 在日内 [min(high,low,prev_close), max(...)] 的分位点均值。论文
    IC +3.47% LS 11.20% IR 1.88。**v1 未做反转中性化**，需要后续 v2 加 cross_section_regress over
    20d return。
universe:
  primary_index: MINUTE_DIR
calculation_steps:
- name: 加载分钟、分类、reduce 到日频
  action: minute_intraday_aggregate
  cache_key: prv_v3
  std_window: 20
  std_threshold: 1.0
  features:
  - peak_vwap
  - daily_high
  - daily_low
  - daily_close
  output_dataframe: data
- name: prev_close (shift 1)
  action: transform
  method: shift
  source_column: daily_close
  output_column: prev_close
  periods: 1
  group_by: order_book_id
- name: high_bound
  action: row_aggregate
  source_columns:
  - daily_high
  - daily_low
  - prev_close
  agg: max
  output_column: high_bound
- name: low_bound
  action: row_aggregate
  source_columns:
  - daily_high
  - daily_low
  - prev_close
  agg: min
  output_column: low_bound
- name: quantile_daily_raw
  action: compute
  formula: (peak_vwap - low_bound) / (high_bound - low_bound)
  source_columns:
  - peak_vwap
  - high_bound
  - low_bound
  output_column: quantile_daily_raw
- name: qgate
  action: compute
  formula: high_bound - low_bound > 0.000001
  source_columns:
  - high_bound
  - low_bound
  output_column: qgate
- name: quantile_daily
  action: compute
  formula: quantile_daily_raw * (qgate / qgate)
  source_columns:
  - quantile_daily_raw
  - qgate
  output_column: quantile_daily
- name: peak_weighted_quantile
  action: rolling
  source_column: quantile_daily
  output_column: peak_weighted_quantile
  window: 20
  agg: mean
  group_by: order_book_id
