# 东吴证券 2023-05-09「换手率变化率的稳定 GTR 因子」GTR
# 定义见 sources/dongwu/paper_13_gtr/paper.md（原文 full.md line 190-196）
factor:
  name: gtr20
  name_cn: 换手率变化率的稳定因子
  category: 量价
  direction: -1
  column: gtr20
  description: >
    过去 20 个交易日「日换手率变化率」的标准差（The Stability of the Growth Rate of Turnover
    Rate）。日换手率变化率 = 今日换手率 / 昨日换手率 - 1（基准是昨日，比 PctTurn20 的 40 日均值
    基准更敏感）。研报口径含横截面市值中性化，IC 为负，方向为 -1。研报强调其与全系列换手率因子
    相关性不超过 0.1，且与 Barra 风格因子相关性绝对值不超过 0.04。
universe:
  primary_index: ALL
calculation_steps:
  - name: 加载日换手率面板（dquant get_turnover_rate 的 today，单位 %）
    action: load_panel
    panel_config: TURNOVER_RATE_PANEL_PATH
    output_column: turnover
  - name: 日换手率变化率 = 今日换手率 / 昨日换手率 - 1
    action: transform
    method: qoq
    periods: 1
    source_column: turnover
    output_column: gtr_daily
  - name: 过去20个交易日换手率变化率的标准差
    action: rolling
    source_column: gtr_daily
    agg: std
    window: 20
    min_periods: 20
    output_column: gtr20
