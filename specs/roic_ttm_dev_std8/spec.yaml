factor:
  name: "roic_ttm_dev_std8"
  name_cn: "过去8期ROIC_TTM标准差的倒数"
  category: "质量"
  direction: 1
  description: >
    以全市场个股为底池，计算过去8个财报期ROIC_TTM标准差的倒数。
    ROIC_TTM越稳定（标准差越小），因子值越大。

data_source:
  api: "get_factor"
  fields:
    - return_on_invested_capital_ttm

calculation_steps:
  - step: 1
    name: "获取ROIC_TTM时间序列"
    action: "fetch"
    api: "get_factor"
    fields: ["return_on_invested_capital_ttm"]
    output: "roic_data"

  - step: 2
    name: "过去8期标准差（变化日rolling）"
    action: "rolling"
    input: "roic_data"
    columns: ["return_on_invested_capital_ttm"]
    window: 8
    min_periods: 4
    agg: "std"
    group_by: "order_book_id"
    "on": "return_on_invested_capital_ttm"
    fill_method: "ffill"
    output: "rolled_data"

  - step: 3
    name: "取倒数"
    action: "compute"
    input: "rolled_data"
    formula: "roic_ttm_dev_std8 = 1 / return_on_invested_capital_ttm"
    output: "factor"

universe:
  primary_index: "ALL"
