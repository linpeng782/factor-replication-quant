# ml_core 实验配置 —— 只改这个文件，然后 python -m ml_core.run
# ============================================================
# 重活全在 ml_core.pipeline.run_train；run.py 读本文件 → 配模型/选策略 → 训练 → 落盘 → 报 IC。
# 训完可选自动推理+导信号（predict.after_train=true），一步到位，不用再跑 ml_core.predict。

run_id: lgbm_shap128_csrank5_dq   # baseline：5 源 192 因子（含 p27）→ SHAP 选 128
model: lgbm                         # lgbm | mlp  ← 换模型只改这一行（超参各自见下方 lgbm:/mlp: 段）

# ── 标签口径（仅 lgbm 线生效；mlp 固定 BinaryMedian）──
# excess_return         ：截面 demean 超额 + 全集 RobustZ（旧口径）
# csrank_normcdf_robust ：逐日 秩→正态分位→稳健Z→clip±3（日内排序等价，只改 L2 样本权重）
label: csrank_normcdf_robust
label_clip: 5.0              # csrank 系专用：截尾阈值；3=尾部压得狠，5=保留头部分辨率（每天 top~0.1% 的区分度）

# ── 数据与因子 ──
sources:                     # baseline 口径：5 源 192 因子 → SHAP 选 128
  - alpha158-dquant
  - kysec-dquant/paper_27_microstructure
  - style-dquant/size
  - kysec-dquant/paper_67_long_momentum
  - htsec/paper_04_momentum
# 5 源 192 因子：Alpha158(158) + p27微观结构(23) + size(1) + ky长动量(2) + ht动量(8)
# 加 market-dquant（市场层广播特征 10 个 vol/regime/breadth/alphaenv）时注意：
# ⚠️ 它是「每日单值广播到全市场」的特征，只能配 model: lgbm。
#    MLP 线的 DailyCrossSectionMAD 逐日截面 zscore 会把当日恒定的列静默抹成全 0 且不报错。
#    详见 docs/20260807_market_broadcast_features_design.md §6.1
neu_sources: null            # 从 factors/neu 读的因子源（与 sources 互补）；null=不用
horizon: 20                  # 远期收益天数

# ── 因子剔除（has_factor=ALL 专用）──
# 这 3 个 p27 因子依赖「峰/岭/谷」分钟喷发判定，天然稀疏（覆盖仅 ~22%），
# 塞进 has_factor=ALL 的 MLP 会剔除 78% 样本。排除后保留率 22% → 87%，样本 295万 → 1166万。
# （LGBM 走 has_factor=NONE 不受影响，不需要剔除；MLP 走 has_factor=ALL 时才需要。）
# exclude_features:
#   - peak_ridge_price_ratio
#   - valley_ridge_price_ratio
#   - ridge_relative_vwap
exclude_features: null

# ── 固定因子集（与 select_method 互斥；启用时跳过 Stage-1 重新选因子）──
# 用途：在既有 run 的入选因子上「原样继承 + 追加新因子」做增量实验，
#      旧因子集一字不动 → 新旧模型差异只来自追加的那几个因子（干净的 A/B）。
# inherit_from：继承该 run_id 的入选清单（selected_features.json，退化 feature_names.json）
# features    ：直接给定基础清单（与 inherit_from 二选一）
# append      ：追加因子（须落在上方 sources 覆盖范围内，否则 build_feature_matrix 会报缺失）
# remove      ：从基础清单剔除因子（消融实验：只拿掉这几个，其余一字不动；先于 append 生效）
feature_set: null              # null=不启用（走下方 select_method 的原有逻辑）

# ── 两阶段选因子 ──
# 内部都用 GBDT 选 top_k：对 LGBM 是经典「筛选→合成」；
# 对 MLP 同样有益（MLP 自身不选因子，先用 GBDT 降维去噪再喂 MLP）。
select_method: shap          # shap | gbdt | null（null=单阶段全因子）；⚠️ 与 feature_set 互斥
top_k: 128                   # 入选因子数（select_method=null 时忽略）

# ── 时间切分（embargo 月不落入任何段；[起, 止]，null 表示开口）──
split:
  train: [null, "2017-11-30"]
  valid: ["2018-01-01", "2019-11-30"]
  test:  ["2020-01-01", null]   # end=null → 自动到入选因子共同覆盖末日

date_sample: null            # 冒烟用：每 k 个交易日取 1（null=全量）

# ── 训练后自动推理 + 导信号（一步到位，省去再跑 ml_core.predict）──
predict:
  after_train: true          # true=训完自动 reload 模型 → predict_live → export_panel
  start: "2020-01-01"        # 推理起始日（通常 = test 段起点）
  end: null                  # null → 自动到入选因子共同覆盖末日
  top_n: 500                 # 每日取预测分 top-N（回测只用排序，不用分数）
  rebuild: true              # true=全段重写信号（新模型覆盖旧信号）；false=append-only

# ── 模型超参（只有 model 选中的那段生效；缺省键走代码默认）──
lgbm:                        # 覆盖 LGBM_DEFAULT_PARAMS 的子集
  seed: 42
  num_threads: 64
  learning_rate: 0.05
  num_leaves: 31
mlp:                         # 输入维度无需填——按数据自动定（单阶段=全特征/两阶段=top_k）
  lr: 0.001
  weight_decay: 0.00001
  patience: 15
  max_epochs: 100
  batch_size: 8192
  device: null               # null → 自动 cuda/cpu
