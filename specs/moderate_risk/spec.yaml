# ============================================
# Spec YAML: moderate_risk
# 版本: 1.0
# 来源: 方正证券研报《成交量激增时刻蕴含的alpha信息》
# ============================================

factor:
  name: "moderate_risk"
  name_cn: "适度冒险因子"
  category: "复合因子"
  tags:
    public: "technical.volume_price.behavioral"
    private: "量价"
  direction: -1
  description: "通过考察个股日内成交量激增时段的价格波动与价格变动，衡量投资者对信息反应适度程度的因子"

formula:
  expression: "(monthly_dazzling_vol + monthly_dazzling_ret) / 2"
  variables:
    - name: "monthly_dazzling_vol"
      definition: "月耀眼波动率"
      formula: "(mean(moderate_daily_vol, 20D) + std(moderate_daily_vol, 20D)) / 2"
    - name: "monthly_dazzling_ret"
      definition: "月耀眼收益率"
      formula: "(mean(moderate_daily_ret, 20D) + std(moderate_daily_ret, 20D)) / 2"
    - name: "moderate_daily_vol"
      definition: "适度日耀眼波动率"
      formula: "|daily_dazzling_vol - cross_sectional_mean|"
    - name: "moderate_daily_ret"
      definition: "适度日耀眼收益率"
      formula: "|daily_dazzling_ret - cross_sectional_mean|"

data_alignment:
  data_source: "米筐RQData"
  api: "get_price"
  pit_mode: false
  fields:
    - variable: "minute_close"
      rq_field: "close"
      table: "get_price"
      frequency: "1m"
      data_type: "point_in_time"
      notes: "分钟收盘价，需剔除开盘收盘"

    - variable: "minute_volume"
      rq_field: "volume"
      table: "get_price"
      frequency: "1m"
      data_type: "cumulative"
      notes: "分钟累计成交量，需计算增量"

    - variable: "market_cap"
      rq_field: "market_cap"
      table: "market_data"
      frequency: "daily"
      data_type: "point_in_time"
      notes: "正交化用"

    - variable: "industry"
      rq_field: "citics_industry"
      table: "market_data"
      frequency: "daily"
      data_type: "category"
      notes: "正交化用"

calculation_steps:
  - step: 1
    name: "获取分钟行情"
    action: "fetch"
    api: "get_price"
    fields: ["close", "volume"]
    frequency: "1m"
    output: "minute_data"

  - step: 2
    name: "剔除开盘收盘"
    action: "filter"
    condition: "time >= '09:30:00' and time <= '11:30:00' or time >= '13:00:00' and time <= '14:56:00'"
    output: "minute_data_filtered"

  - step: 3
    name: "计算成交量增量"
    action: "transform"
    method: "diff"
    target_column: "volume"
    output: "volume_increase"

  - step: 4
    name: "识别激增时刻"
    action: "compute"
    formula: "surge_flag = (volume_increase > mean + std)"
    group_by: "[order_book_id, date]"
    output: "surge_moments"

  - step: 5
    name: "构造耀眼5分钟"
    action: "transform"
    method: "expand_window"
    window: 5
    condition: "surge_flag == 1"
    output: "dazzling_5min"

  - step: 6
    name: "计算分钟收益率"
    action: "compute"
    formula: "minute_ret = close.pct_change()"
    output: "minute_returns"

  - step: 7
    name: "计算耀眼波动率"
    action: "compute"
    formula: "dazzling_vol = minute_ret.rolling(5).std()"
    condition: "dazzling_5min == 1"
    output: "dazzling_vol_per_moment"

  - step: 8
    name: "计算日耀眼波动率"
    action: "compute"
    formula: "daily_dazzling_vol = dazzling_vol_per_moment.mean()"
    group_by: "[order_book_id, date]"
    output: "daily_dazzling_vol"

  - step: 9
    name: "计算适度日耀眼波动率"
    action: "compute"
    formula: "moderate_daily_vol = abs(daily_dazzling_vol - cross_sectional_mean)"
    output: "moderate_daily_vol"

  - step: 10
    name: "计算月耀眼波动率"
    action: "transform"
    method: "rolling_stats"
    window: "20D"
    stats: ["mean", "std"]
    output: "monthly_dazzling_vol_raw"

  - step: 11
    name: "合成月耀眼波动率"
    action: "compute"
    formula: "monthly_dazzling_vol = (mean + std) / 2"
    output: "monthly_dazzling_vol"

  - step: 12
    name: "计算日耀眼收益率"
    action: "compute"
    formula: "daily_dazzling_ret = minute_returns[surge_flag].mean()"
    group_by: "[order_book_id, date]"
    output: "daily_dazzling_ret"

  - step: 13
    name: "计算适度日耀眼收益率"
    action: "compute"
    formula: "moderate_daily_ret = abs(daily_dazzling_ret - cross_sectional_mean)"
    output: "moderate_daily_ret"

  - step: 14
    name: "计算月耀眼收益率"
    action: "transform"
    method: "rolling_stats"
    window: "20D"
    stats: ["mean", "std"]
    output: "monthly_dazzling_ret_raw"

  - step: 15
    name: "合成月耀眼收益率"
    action: "compute"
    formula: "monthly_dazzling_ret = (mean + std) / 2"
    output: "monthly_dazzling_ret"

  - step: 16
    name: "合成适度冒险因子"
    action: "compute"
    formula: "moderate_risk = (monthly_dazzling_vol + monthly_dazzling_ret) / 2"
    output: "moderate_risk"

  - step: 17
    name: "市值行业正交化"
    action: "transform"
    method: "orthogonalize"
    controls: ["market_cap", "citics_industry"]
    output: "moderate_risk_neutral"

universe:
  primary_index: "全部A股"
  filter:
    - type: "liquidity"
      min_listing_days: 60
  exclusion:
    - "ST股票"
    - "停牌股票"

backtest:
  rebalance:
    frequency: "monthly"
    trigger: "month_end"
  holding:
    count: null
    weighting: "equal"
  benchmark: "中证500"
  transaction_cost:
    commission: 0.0015
    slippage: 0.0
  direction: -1

validation:
  expected_ic_mean: [-0.09, -0.03]
  expected_ic_ir: [-5.0, -3.0]
  expected_monotonicity: true
  expected_group_order: "group1 > group2 > group3 > group4 > group5"

risk_warnings:
  - level: "high"
    item: "分钟数据质量"
    description: "分钟行情数据量大，缺失/异常值处理复杂"
  - level: "high"
    item: "成交量定义差异"
    description: "米筐分钟成交量可能是累计量或独立量，需确认"
  - level: "medium"
    item: "正交化实现"
    description: "市值和行业正交化方法影响结果"
  - level: "medium"
    item: "参数敏感性"
    description: "20日窗口、1倍标准差阈值均为研报设定"

version_control:
  spec_version: "1.0"
  created_by: "agent"
  reviewed_by: "human"
  status: "pending"
