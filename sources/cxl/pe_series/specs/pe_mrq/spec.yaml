factor:
  name: pe_mrq
  name_cn: "PE_MRQ（总市值/季度净利润）"
  category: 价值
  direction: -1
  column: pe_mrq
  description: >
    最近一期单季度市盈率：总市值 / 单季度净利润 (mrq_0)。
    PE 越低估值越便宜，因子方向为负向。

universe:
  primary_index: ALL

calculation_steps:
  - name: 获取总市值与单季度净利润
    action: fetch
    api: get_factor
    fields: [market_cap_3, net_profit_mrq_0]
    output_columns:
      market_cap_3: market_cap_3
      net_profit_mrq_0: net_profit_mrq_0

  - name: 计算 PE_MRQ
    action: compute
    formula: market_cap_3 / net_profit_mrq_0
    source_columns: [market_cap_3, net_profit_mrq_0]
    output_column: pe_mrq
