# 东吴证券 2021-05-15「量稳换手率选股因子」量稳换手率因子 STR
# 定义见 sources/dongwu/paper_07_stable_turnover/paper.md（原文 full.md line 153-157）
factor:
  name: str20
  name_cn: 量稳换手率因子
  category: 量价
  direction: -1
  column: str20
  description: >
    过去 20 个交易日换手率的标准差（The Stability of Turnover Rate）。研报口径：每月月底回看
    20 个交易日算换手率标准差，再做横截面市值中性化。换手率波动越小未来越可能上涨，IC 为负，
    方向为 -1。研报中该因子表现大幅优于 Turn20 与 PctTurn20（多空年化 42.99%，IR 2.96）。
universe:
  primary_index: ALL
calculation_steps:
  - name: 加载日换手率面板（dquant get_turnover_rate 的 today，单位 %）
    action: load_panel
    panel_config: TURNOVER_RATE_PANEL_PATH
    output_column: turnover
  - name: 过去20个交易日换手率的标准差
    action: rolling
    source_column: turnover
    agg: std
    window: 20
    min_periods: 20
    output_column: str20
