factor:
  name: pe_ttm_delta60
  name_cn: "PE_TTM 60日差值"
  category: 价值
  direction: -1
  column: pe_ttm_delta60
  description: >
    PE_TTM 的 60 日差值。PE 下降越多（差值越负），预期收益越高。
    因子方向为负向。

universe:
  primary_index: ALL

calculation_steps:
  - name: 获取 PE_TTM
    action: fetch
    api: get_factor
    fields: [pe_ratio_ttm]
    output_column: pe_ratio_ttm

  - name: 计算 60 日差值
    action: transform
    method: diff
    source_column: pe_ratio_ttm
    output_column: pe_ttm_delta60
    periods: 60
    group_by: order_book_id
