factor:
  name: ridge_minute_return
  name_cn: 量岭分钟收益
  category: 微观结构
  direction: -1
  column: ridge_minute_return
  description: 过去 20 日量岭分钟的累计 1-min 收益和。论文 IC -6.29% LS 14.98% IR 1.73（散户过度反应）。
universe:
  primary_index: MINUTE_DIR
calculation_steps:
- name: 加载分钟、分类、reduce 到日频
  action: minute_intraday_aggregate
  cache_key: prv_v3
  std_window: 20
  std_threshold: 1.0
  features:
  - ridge_return_sum
  output_dataframe: data
- name: ridge_minute_return
  action: rolling
  source_column: ridge_return_sum
  output_column: ridge_minute_return
  window: 20
  agg: sum
  group_by: order_book_id
