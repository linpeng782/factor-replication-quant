# 东吴证券 2021-05-15「量稳换手率选股因子」传统换手率因子 Turn20
# 定义见 sources/dongwu/paper_07_stable_turnover/paper.md（原文 full.md line 91）
factor:
  name: turn20
  name_cn: 传统换手率因子
  category: 量价
  direction: -1
  column: turn20
  description: >
    过去 20 个交易日的日均换手率。研报口径：每月月底计算每只股票过去 20 个交易日的日均换手率，
    再做横截面市值中性化。换手率越小的股票未来越可能上涨，IC 为负，方向为 -1。
universe:
  primary_index: ALL
calculation_steps:
  - name: 加载日换手率面板（dquant get_turnover_rate 的 today，单位 %）
    action: load_panel
    panel_config: TURNOVER_RATE_PANEL_PATH
    output_column: turnover
  - name: 过去20个交易日的日均换手率
    action: rolling
    source_column: turnover
    agg: mean
    window: 20
    min_periods: 20
    output_column: turn20
