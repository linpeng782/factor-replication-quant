factor:
  name: roe_pqoq_mrq
  name_cn: "单季度 ROE 环比（分母 > 0 版）"
  category: 景气
  direction: 1
  column: roe_pqoq_mrq
  description: >
    单季度 ROE 环比增长率：(roe_mrq_0 - roe_mrq_1) / abs(roe_mrq_1)。
    仅保留上季度 ROE > 0 的样本（过滤负基数）。
    因子方向为正向，ROE 改善预期收益更高。

universe:
  primary_index: ALL

calculation_steps:
  - name: 获取当期与上季度单季度数据
    action: fetch
    api: get_factor
    fields: [net_profit_mrq_0, total_equity_mrq_0, net_profit_mrq_1, total_equity_mrq_1]
    output_columns:
      net_profit_mrq_0: net_profit_mrq_0
      total_equity_mrq_0: total_equity_mrq_0
      net_profit_mrq_1: net_profit_mrq_1
      total_equity_mrq_1: total_equity_mrq_1

  - name: 计算当期单季度 ROE
    action: compute
    formula: net_profit_mrq_0 / total_equity_mrq_0
    source_columns: [net_profit_mrq_0, total_equity_mrq_0]
    output_column: roe_mrq_0

  - name: 计算上季度单季度 ROE
    action: compute
    formula: net_profit_mrq_1 / total_equity_mrq_1
    source_columns: [net_profit_mrq_1, total_equity_mrq_1]
    output_column: roe_mrq_1

  - name: 计算单季度 ROE 环比
    action: compute
    formula: (roe_mrq_0 - roe_mrq_1) / abs(roe_mrq_1)
    source_columns: [roe_mrq_0, roe_mrq_1]
    output_column: roe_pqoq_mrq

  - name: 过滤分母 > 0
    action: filter
    condition: roe_mrq_1 > 0
