factor:
  name: ridge_relative_vwap
  name_cn: 量岭相对加权价
  category: 微观结构
  direction: -1
  column: ridge_relative_vwap
  description: 过去 20 日 ridge_vwap / daily_vwap 的均值（均后复权口径）。论文 IC -6.27% LS 17.99%
    IR 2.27。
universe:
  primary_index: MINUTE_DIR
calculation_steps:
- name: 加载分钟、分类、reduce 到日频
  action: minute_intraday_aggregate
  cache_key: prv_v3
  std_window: 20
  std_threshold: 1.0
  features:
  - ridge_vwap
  - daily_vwap
  output_dataframe: data
- name: ridge_rel_vwap_daily
  action: compute
  formula: ridge_vwap / daily_vwap
  source_columns:
  - ridge_vwap
  - daily_vwap
  output_column: ridge_rel_vwap_daily
- name: ridge_relative_vwap
  action: rolling
  source_column: ridge_rel_vwap_daily
  output_column: ridge_relative_vwap
  window: 20
  agg: mean
  group_by: order_book_id
