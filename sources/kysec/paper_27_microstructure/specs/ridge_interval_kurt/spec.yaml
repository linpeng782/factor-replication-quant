factor:
  name: ridge_interval_kurt
  name_cn: 量岭间隔峰度
  category: 微观结构
  direction: -1
  column: ridge_interval_kurt
  description: 过去 20 日 pooled 量岭间隔分布峰度。论文 IC -7.61% LS 19.47% IR 2.45。
universe:
  primary_index: MINUTE_DIR
calculation_steps:
- name: 加载分钟、分类、reduce 到日频
  action: minute_intraday_aggregate
  cache_key: prv_v3
  std_window: 20
  std_threshold: 1.0
  features:
  - ridge_interval_n
  - ridge_interval_m1
  - ridge_interval_m2
  - ridge_interval_m3
  - ridge_interval_m4
  output_dataframe: data
- name: pi_n_20
  action: rolling
  source_column: ridge_interval_n
  output_column: pi_n_20
  window: 20
  agg: sum
  group_by: order_book_id
- name: pi_m1_20
  action: rolling
  source_column: ridge_interval_m1
  output_column: pi_m1_20
  window: 20
  agg: sum
  group_by: order_book_id
- name: pi_m2_20
  action: rolling
  source_column: ridge_interval_m2
  output_column: pi_m2_20
  window: 20
  agg: sum
  group_by: order_book_id
- name: pi_m3_20
  action: rolling
  source_column: ridge_interval_m3
  output_column: pi_m3_20
  window: 20
  agg: sum
  group_by: order_book_id
- name: pi_m4_20
  action: rolling
  source_column: ridge_interval_m4
  output_column: pi_m4_20
  window: 20
  agg: sum
  group_by: order_book_id
- name: pi_mean
  action: compute
  formula: pi_m1_20 / pi_n_20
  source_columns:
  - pi_m1_20
  - pi_n_20
  output_column: pi_mean
- name: pi_var
  action: compute
  formula: pi_m2_20 / pi_n_20 - pi_mean ** 2
  source_columns:
  - pi_m2_20
  - pi_n_20
  - pi_mean
  output_column: pi_var
- name: kurt_raw
  action: compute
  formula: (pi_m4_20 - 4 * pi_mean * pi_m3_20 + 6 * pi_mean ** 2 * pi_m2_20 - 3 *
    pi_n_20 * pi_mean ** 4) / (pi_n_20 * pi_var ** 2) - 3
  source_columns:
  - pi_m4_20
  - pi_mean
  - pi_m3_20
  - pi_m2_20
  - pi_n_20
  - pi_var
  output_column: kurt_raw
- name: gate
  action: compute
  formula: (pi_n_20 >= 5) * (pi_var > 0.000000000001)
  source_columns:
  - pi_n_20
  - pi_var
  output_column: gate
- name: ridge_interval_kurt
  action: compute
  formula: kurt_raw * (gate / gate)
  source_columns:
  - kurt_raw
  - gate
  output_column: ridge_interval_kurt
