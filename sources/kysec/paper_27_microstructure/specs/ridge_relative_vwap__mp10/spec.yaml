factor:
  name: ridge_relative_vwap__mp10
  name_cn: 量岭相对加权价（mp10）
  category: 微观结构
  direction: -1
  column: ridge_relative_vwap__mp10
  description: |
    Variant of `ridge_relative_vwap`; 唯一改动 = rolling step `min_periods: 20 → 10`。
    动机：原版 78% 缺失。放宽到 10 允许窗口内最多 10 天 NaN，预期 miss → 30–45%；
    用本变体观察 ICIR 衰减曲线。
universe:
  primary_index: MINUTE_DIR
calculation_steps:
- name: 加载分钟、分类、reduce 到日频
  action: minute_intraday_aggregate
  cache_key: prv_v3
  std_window: 20
  std_threshold: 1.0
  features:
  - ridge_vwap
  - daily_vwap
  output_dataframe: data
- name: ridge_rel_vwap_daily
  action: compute
  formula: ridge_vwap / daily_vwap
  source_columns:
  - ridge_vwap
  - daily_vwap
  output_column: ridge_rel_vwap_daily
- name: ridge_relative_vwap__mp10
  action: rolling
  source_column: ridge_rel_vwap_daily
  output_column: ridge_relative_vwap__mp10
  window: 20
  min_periods: 10
  agg: mean
  group_by: order_book_id
