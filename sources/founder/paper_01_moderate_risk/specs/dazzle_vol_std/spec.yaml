# 方正微观结构① 月稳耀眼波动率。论文: RankIC -7.87%, ICIR -4.02, 多空年化 30.64%
factor:
  name: dazzle_vol_std
  name_cn: 月稳耀眼波动率
  category: 微观结构
  direction: -1
  column: dazzle_vol_std
  description: 近20日"适度日耀眼波动率"的标准差(稳定=取波动)。日耀眼波动率见 dazzle_vol_mean。
    适度=|日值−当日截面均值|。波动越不稳定→反转，direction=-1。方正微观①§3.2。
universe:
  primary_index: MINUTE_DIR
calculation_steps:
  - {name: 分钟→日频耀眼波动率, action: minute_dazzle, cache_key: dazzle_v1, features: [dazzle_vol], output_dataframe: data}
  - {name: 截面去均值, action: transform, method: cs_demean, source_column: dazzle_vol, output_column: vol_dm, group_by: date}
  - {name: 取绝对值(适度日耀眼波动率), action: transform, method: abs, source_column: vol_dm, output_column: moderate_vol}
  - {name: 月稳(std20), action: rolling, source_column: moderate_vol, output_column: dazzle_vol_std, window: 20, min_periods: 15, agg: std, group_by: order_book_id}
